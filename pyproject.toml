[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "london-protest-predictor"
version = "0.1.0"
description = "London protest route research and ingestion"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0",  # imported directly in ingestion.crawler.client (Retry), not only via requests
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",  # Parquet I/O for pandas/geopandas; no direct import in application code
    "duckdb==1.5.5",
    "duckdb-extension-spatial==1.5.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "geopandas>=1.0",
    "shapely>=2.0.6",
    "pyproj>=3.6",
    "osmnx>=2.0,<3",
    "networkx>=3.2,<4",
    "numpy>=2.0",
    "scipy>=1.11",
    "astral>=3.2",
    "streamlit>=1.40",
    "altair>=5.0",
    "pydeck>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.scripts]
lpp-ingest = "ingestion.crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["D203", "D213"]
select = [
    "E",
    "F",
    "W",
    "B",
    "SIM",
    "C90",
    "UP",
    "N",
    "RET",
    "ARG",
    "PTH",
    "TRY",
    "EM",
    "DTZ",
    "S",
    "I",
    "RUF",
    "ANN",
    "D",
]

# Temporary suppressions: see docs/design-decisions.md#lint-suppressions.
[tool.ruff.lint.per-file-ignores]
"src/ingestion/route_research/**" = [
    "E501",
    "TRY003",
    "EM102",
    "PTH123",
    "DTZ011",
    "SIM108",
    "SIM105",
    "PTH109",
    "TRY300",
    "E402",
    "ANN",
    "D",
    "RUF007",
]
"src/ingestion/crawler/**" = ["ANN", "D", "RUF001"]
"tests/route_research/**" = ["E501", "DTZ001", "TRY003", "EM102", "ARG005", "F841", "ANN", "D"]
"tests/**" = ["S101", "ARG001", "ANN", "D", "RUF059"]
"app.py" = ["D100"]
"src/__init__.py" = ["D104"]
"src/models/**" = [
    "E501",
    "N806",
    "S101",
    "B905",
    "B007",
    "PTH123",
    "TRY003",
    "EM101",
    "I001",
    "UP017",
    "ANN",
    "D",
    "RUF007",
    "RUF005",
    "RUF059",
]
"src/database/**" = ["E501", "DTZ005", "ANN", "D"]
"tests/crawler/**" = ["TRY003", "EM101", "ANN", "D"]
"src/ui/**" = ["ANN", "D"]
"ingest.py" = ["ANN", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
