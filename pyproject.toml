[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "london-protest-predictor"
version = "0.1.0"
description = "London protest route research and ingestion"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",
    "duckdb>=1.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
lpp-ingest = "ingestion.crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C90", "UP", "N", "RET", "ARG", "PTH", "TRY", "EM", "DTZ", "S", "I"]

# Discipline B: tighten after phase-2 cleanup (see docs/phase2.md).
[tool.ruff.lint.per-file-ignores]
"src/ingestion/route_research/**" = [
    "E501",
    "TRY003",
    "EM102",
    "PTH123",
    "DTZ011",
    "SIM108",
    "SIM105",
    "PTH109",
    "TRY300",
    "C901",
    "E402",
]
"tests/route_research/**" = ["E501", "DTZ001", "TRY003", "EM102", "ARG005", "F841"]
"tests/**" = ["S101", "ARG001", "PLC0415"]
"src/models/**" = [
    "E501",
    "E701",
    "E702",
    "N806",
    "S101",
    "B905",
    "B007",
    "PTH123",
    "S301",
    "TRY003",
    "EM101",
    "I001",
    "UP017",
]
"src/database/**" = ["E501", "E701", "S608", "DTZ005"]
"tests/crawler/**" = ["TRY003", "EM101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
