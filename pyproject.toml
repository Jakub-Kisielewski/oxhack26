[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "london-protest-predictor"
version = "0.1.0"
description = "London protest route research and ingestion"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",
    "duckdb>=1.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
lpp-ingest = "ingestion.crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C90", "UP", "N", "RET", "ARG", "PTH", "TRY", "EM", "DTZ", "S", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
